<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Availability - Calendly Clone</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/availability.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        Calendly<span>Clone</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>

        <button id="logoutBtn" class="logout-btn">
            Logout
        </button>
    </nav>

</header>


<main class="availability-container">

    <div class="page-heading">

        <h1>Set Your Availability</h1>

        <p>
            Choose the days and times when people can book meetings with you.
        </p>

    </div>


    <!-- Add Availability -->

    <section class="availability-card">

        <h2>Add Availability</h2>

        <form id="availabilityForm">

            <div class="form-group">

                <label for="day">
                    Day
                </label>

                <select id="day" required>

                    <option value="">Select a day</option>

                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                    <option value="Saturday">Saturday</option>
                    <option value="Sunday">Sunday</option>

                </select>

            </div>


            <div class="time-row">

                <div class="form-group">

                    <label for="startTime">
                        Start Time
                    </label>

                    <input
                        type="time"
                        id="startTime"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="endTime">
                        End Time
                    </label>

                    <input
                        type="time"
                        id="endTime"
                        required
                    >

                </div>

            </div>


            <button type="submit" class="primary-btn">
                Save Availability
            </button>

        </form>


        <p id="availabilityMessage"></p>

    </section>


    <!-- Saved Availability -->

    <section class="saved-section">

        <h2>Your Availability</h2>

        <div id="availabilityList">

            <div class="empty-message">
                No availability added yet.
            </div>

        </div>

    </section>

</main>


<script src="js/availability.js"></script>

</body>

</html>
